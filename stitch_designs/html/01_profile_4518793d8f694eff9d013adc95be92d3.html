          Cancel
        </button>
<button class="flex-1 h-14 rounded-full bg-primary text-on-primary font-body-md text-body-md font-semibold flex items-center justify-center active:opacity-90 transition-all" id="btn-save" type="submit">

        </button>
</div>
</form>
</div>
</div>
<script>
  (function() {
    const navProfile = document.querySelector('nav a[data-path="profile"]');
    if (navProfile) {
      document.querySelectorAll('nav a').forEach(el => {
        el.classList.remove('text-primary', 'font-semibold');
        el.classList.add('text-on-surface-variant');
      });
      navProfile.classList.add('text-primary', 'font-semibold');
      navProfile.classList.remove('text-on-surface-variant');
    }

    const viewMode = document.getElementById('view-mode');
    const editMode = document.getElementById('edit-mode');
    const btnEdit = document.getElementById('btn-edit');
    const btnCancel = document.getElementById('btn-cancel');

    const displayName = document.getElementById('display-name');
    const displayPhone = document.getElementById('display-phone');
    const displayEmail = document.getElementById('display-email');

    const inputName = document.getElementById('input-name');
    const inputPhone = document.getElementById('input-phone');
    const inputEmail = document.getElementById('input-email');

    if (btnEdit && editMode && viewMode) {
      btnEdit.addEventListener('click', () => {
        inputName.value = displayName.textContent.trim();
        inputPhone.value = displayPhone.textContent.trim();
        inputEmail.value = displayEmail.textContent.trim();
        viewMode.classList.add('hidden');
        editMode.classList.remove('hidden');
        editMode.classList.add('flex');
        inputName.focus();
      });
    }

    if (btnCancel && editMode && viewMode) {
      btnCancel.addEventListener('click', () => {
        editMode.classList.add('hidden');
        editMode.classList.remove('flex');
        viewMode.classList.remove('hidden');
      });
    }

    if (editMode && viewMode) {
      editMode.addEventListener('submit', (e) => {
        e.preventDefault();
        if (inputName.value.trim()) displayName.textContent = inputName.value.trim();
        if (inputPhone.value.trim()) displayPhone.textContent = inputPhone.value.trim();
        if (inputEmail.value.trim()) displayEmail.textContent = inputEmail.value.trim();
        editMode.classList.add('hidden');
        editMode.classList.remove('flex');
        viewMode.classList.remove('hidden');
      });
    }
  })();
